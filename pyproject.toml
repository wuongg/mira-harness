[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "frog-harness"
dynamic = ["version"]
description = "Frog - harness doi nhom agent (nen R0 shadow): giao viec, xem log, do luong"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license = { text = "MIT" }

[project.scripts]
frog = "frog.cli:main"
mira = "frog.cli:deprecated_mira"
r0 = "frog.cli:deprecated_main"
r0-shadow = "frog.cli:deprecated_main"

[tool.setuptools]
packages = ["frog"]

[tool.setuptools.package-data]
frog = ["prices.toml", "tui_palette_256.txt"]

[tool.setuptools.dynamic]
version = {attr = "frog.__version__"}
