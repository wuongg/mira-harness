name: test

on:
  push:
  pull_request:

jobs:
  unittest:
    name: unittest (${{ matrix.os }} / ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Chạy toàn bộ unittest
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > unittest.txt 2>&1
          echo $? > unittest.exit
      - name: Ghi annotation từng test đỏ
        if: always()
        shell: bash
        run: python tools/ci_annotate.py unittest.txt "$(tr -d '\r' < unittest.exit)"
      - name: Giữ log unittest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unittest-${{ matrix.os }}-${{ matrix.python-version }}
          path: |
            unittest.txt
            unittest.exit
          retention-days: 7

  shadow:
    name: shadow (3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Chạy shadow
        run: python -m frog run --out out --quiet

  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Ngưỡng 0.90 cho cả precision và recall của mọi nhóm AXES.
      # Precision dưới 0.90 là báo sai. Recall dưới 0.90 là lọt.
      # Lệnh in bảng sáu nhóm ra stdout trước, rồi trả 1 nếu có nhóm dưới ngưỡng.
      # Không hạ ngưỡng trên dòng lệnh. Job này đứng riêng, không nằm trong ma trận 8 ô.
      - name: In bảng rồi so ngưỡng
        run: python -m frog eval --suite adversarial

  commit-lint:
    name: commit-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Chọn range
        id: range
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "spec=${{ github.event.pull_request.base.sha }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "spec=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Lint tiêu đề
        if: steps.range.outputs.skip != '1'
        run: python tools/check_commits.py "${{ steps.range.outputs.spec }}"
